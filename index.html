<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canopi Repository</title>
<meta name="description" content="Canopi's internal team repository — SOPs, policies, projects, meeting notes, and resources.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="auth-screen" id="auth-screen">
  <div class="auth-card">
    <span class="auth-logo"><img src="assets/canopi-logo.png" alt=""></span>
    <h1>Canopi Repository</h1>
    <div id="auth-body"><p class="auth-note">Loading&hellip;</p></div>
  </div>
</div>
<div class="shell" hidden>
  <div class="frame">

    <aside class="sidebar">
      <a href="#home" class="sidebar-brand">
        <span class="sidebar-brand-mark"><img src="assets/canopi-logo.png" alt="Canopi"></span>
        <span class="sidebar-brand-name">Canopi</span>
      </a>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-account" id="sidebar-account"></div>
    </aside>

    <main class="main">
      <div class="content" id="content"></div>
      <div class="footer-note">Internal team repository &mdash; content maintained by the team. Not for external distribution.</div>
    </main>

  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="app.js"></script>
</body>
</html>
